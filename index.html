<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b63"><title>Student Practice Hub | Grades 3 & 6</title><style>
:root{--navy:#173b63;--ink:#1b2b41;--muted:#687b91;--bg:#f5f8fc;--line:#e2e9f2;--green:#087d70}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,'Segoe UI',Tahoma,sans-serif}header{background:linear-gradient(125deg,#14375e,#24628c);color:white;padding:40px 18px 46px;text-align:center}header .mark{font-size:35px}h1{font-size:clamp(26px,5vw,40px);margin:10px 0 7px}header p{margin:7px 0;color:#e6f3ff}.wrap{max-width:1050px;margin:-22px auto 45px;padding:0 18px}.selector{display:flex;gap:12px;justify-content:center;margin-bottom:27px}.grade{border:2px solid #d7e3f0;background:#fff;border-radius:15px;padding:14px 29px;font-size:17px;font-weight:700;color:var(--navy);cursor:pointer;box-shadow:0 5px 16px #173b6310}.grade.active{background:var(--navy);color:white;border-color:var(--navy)}.intro{text-align:center;margin:12px 0 25px}.intro h2{margin:0 0 6px;font-size:24px}.intro p{margin:0;color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:23px 15px 18px;text-align:center;box-shadow:0 6px 20px #12345a0a;display:flex;flex-direction:column;align-items:center;min-height:206px}.emoji{width:66px;height:66px;display:grid;place-items:center;border-radius:19px;font-size:32px;background:var(--tint)}.card h3{font-size:17px;margin:14px 0 5px}.ar{font-size:14px;color:var(--muted);direction:rtl;line-height:1.4;min-height:20px}.open{margin-top:auto;padding:10px 16px;border:0;background:#e8f4f2;color:#08766c;border-radius:10px;font-weight:700;cursor:pointer}.open:hover{background:#d3ede9}.detail{margin:24px auto 0;max-width:760px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;display:none;box-shadow:0 7px 24px #12345a0b}.detail.show{display:block}.detail h2{margin:0 0 7px}.detail p{color:var(--muted);line-height:1.6}.pill{display:inline-block;background:#eff4fa;border-radius:30px;padding:7px 12px;font-size:13px;color:var(--navy);font-weight:bold}.empty{border:1px dashed #bdcddd;background:#f8fafc;border-radius:13px;padding:19px;text-align:center;margin-top:15px;color:#586b7e}.link{display:inline-block;background:var(--green);color:white;text-decoration:none;border-radius:11px;padding:12px 17px;font-weight:700;margin-top:12px}.small{font-size:13px}.back{background:none;border:0;color:var(--navy);font-weight:bold;cursor:pointer;padding:0;margin-bottom:13px}footer{text-align:center;padding:12px 20px 32px;color:#8290a0;font-size:13px}footer span{display:block;margin-top:5px}a:focus-visible,button:focus-visible{outline:3px solid #e2a54a;outline-offset:3px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:420px){.grid{gap:10px}.card{padding:17px 9px;min-height:197px}.card h3{font-size:15px}.ar{font-size:13px}.grade{padding:13px 24px}}
</style></head><body><header><div class="mark">🎓</div><h1>Student Practice Hub</h1><p>Learn • Practice • Succeed</p><p lang="ar" dir="rtl">مراجعات واختبارات تفاعلية للطلاب</p></header><main class="wrap"><div class="selector" aria-label="Choose grade"><button class="grade active" id="g3" onclick="setGrade(3)" aria-pressed="true">Grade 3</button><button class="grade" id="g6" onclick="setGrade(6)" aria-pressed="false">Grade 6</button></div><div class="intro"><h2 id="heading">Grade 3 Subjects</h2><p>Choose a subject to explore practice quizzes. <span lang="ar" dir="rtl">اختاروا المادة لعرض المراجعات المتوفرة.</span></p></div><section class="grid" id="grid"></section><section class="detail" id="detail" aria-live="polite"></section></main><footer>Made for learning and sharing 💙<span>Free access • No student account required</span></footer><script>
// To publish new quizzes, upload each quiz HTML into a folder in this repository
// and add its relative URL to the relevant entry below.
const subjects=[
{id:'arabic',en:'Arabic',ar:'اللغة العربية',icon:'📖',tint:'#f4eafa'},
{id:'math',en:'Mathematics',ar:'الرياضيات',icon:'🔢',tint:'#e7f0ff'},
{id:'english',en:'English',ar:'اللغة الإنجليزية',icon:'🔤',tint:'#fff0dd'},
{id:'science',en:'Science',ar:'العلوم',icon:'🔬',tint:'#e6f7ed'},
{id:'islamic',en:'Islamic Studies',ar:'التربية الإسلامية',icon:'🌙',tint:'#e9f7f2'},
{id:'civics',en:'Civics',ar:'الدراسات الاجتماعية بالعربي',icon:'🏛️',tint:'#f4eddf'},
{id:'social',en:'Social Studies',ar:'الدراسات الاجتماعية بالإنجليزي',icon:'🌍',tint:'#e8f5fc'},
{id:'computing',en:'Computing',ar:'الحاسوب',icon:'💻',tint:'#eeecff'}
];
// Each entry format: {title:'Week 8 – Practice 1', url:'quizzes/grade3/arabic/week8.html'}
const quizzes={3:{arabic:[],math:[],english:[],science:[],islamic:[],civics:[],social:[],computing:[]},6:{arabic:[],math:[],english:[],science:[],islamic:[],civics:[],social:[],computing:[]}};
let grade=3;
function setGrade(n){grade=n;document.getElementById('g3').classList.toggle('active',n===3);document.getElementById('g6').classList.toggle('active',n===6);document.getElementById('g3').setAttribute('aria-pressed',n===3);document.getElementById('g6').setAttribute('aria-pressed',n===6);document.getElementById('heading').textContent='Grade '+n+' Subjects';document.getElementById('detail').classList.remove('show');}
function render(){document.getElementById('grid').innerHTML=subjects.map(s=>`<article class="card"><div class="emoji" style="--tint:${s.tint}" aria-hidden="true">${s.icon}</div><h3>${s.en}</h3><div class="ar" lang="ar">${s.ar}</div><button class="open" onclick="showSubject('${s.id}')">View Practices →</button></article>`).join('');}
function showSubject(id){const s=subjects.find(x=>x.id===id),items=quizzes[grade][id],panel=document.getElementById('detail');const list=items.length?items.map(item=>`<div><a class="link" href="${encodeURI(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(item.title)} ↗</a></div>`).join(''):`<div class="empty"><strong>Practices coming soon</strong><p lang="ar" dir="rtl">المراجعات بتنضاف قريباً لهذه المادة.</p></div>`;panel.innerHTML=`<button class="back" onclick="document.getElementById('detail').classList.remove('show')">← Back to subjects</button><h2>${s.icon} ${s.en}</h2><p lang="ar" dir="rtl">${s.ar}</p><span class="pill">Grade ${grade}</span>${list}`;panel.classList.add('show');panel.scrollIntoView({behavior:'smooth',block:'start'});}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}render();
</script></body></html>
